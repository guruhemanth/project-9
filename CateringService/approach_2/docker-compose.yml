version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: caterconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-caterconnect}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01_init_schemas.sql:/docker-entrypoint-initdb.d/01_init_schemas.sql
      - ./database/03_availability_schema.sql:/docker-entrypoint-initdb.d/03_availability_schema.sql
      - ./database/04_settlement_schema.sql:/docker-entrypoint-initdb.d/04_settlement_schema.sql
      - ./database/05_notification_schema.sql:/docker-entrypoint-initdb.d/05_notification_schema.sql
      - ./database/06_chat_schema.sql:/docker-entrypoint-initdb.d/06_chat_schema.sql
      - ./database/07_pan_india_location.sql:/docker-entrypoint-initdb.d/07_pan_india_location.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth/Dockerfile
    container_name: caterconnect-auth-service
    restart: always
    environment:
      PORT: 4001
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (min 32 chars) is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://caterconnect.in,https://partner.caterconnect.in}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4001/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caterer-menu-service:
    build:
      context: .
      dockerfile: backend/services/caterer-menu/Dockerfile
    container_name: caterconnect-caterer-menu-service
    restart: always
    environment:
      PORT: 4002
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://caterconnect.in,https://partner.caterconnect.in}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4002/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  booking-order-service:
    build:
      context: .
      dockerfile: backend/services/booking-order/Dockerfile
    container_name: caterconnect-booking-order-service
    restart: always
    environment:
      PORT: 4003
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://caterconnect.in,https://partner.caterconnect.in}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4003/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment/Dockerfile
    container_name: caterconnect-payment-service
    restart: always
    environment:
      PORT: 4004
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID is required}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET is required}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://caterconnect.in,https://partner.caterconnect.in}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4004/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification/Dockerfile
    container_name: caterconnect-notification-service
    restart: always
    environment:
      PORT: 4005
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://caterconnect.in,https://partner.caterconnect.in}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4005/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-service:
    build:
      context: .
      dockerfile: backend/services/chat/Dockerfile
    container_name: caterconnect-chat-service
    restart: always
    environment:
      PORT: 4006
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://caterconnect.in,https://partner.caterconnect.in}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4006/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: caterconnect-api-gateway
    restart: always
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (min 32 chars) is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://caterconnect.in,https://partner.caterconnect.in}
      AUTH_SERVICE_URL: http://auth-service:4001
      CATERER_SERVICE_URL: http://caterer-menu-service:4002
      BOOKING_SERVICE_URL: http://booking-order-service:4003
      PAYMENT_SERVICE_URL: http://payment-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
      CHAT_SERVICE_URL: http://chat-service:4006
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      caterer-menu-service:
        condition: service_healthy
      booking-order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  customer-app:
    build:
      context: .
      dockerfile: frontend/customer/Dockerfile
    container_name: caterconnect-customer-app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  partner-app:
    build:
      context: .
      dockerfile: frontend/partner/Dockerfile
    container_name: caterconnect-partner-app
    restart: always
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  pgdata:
