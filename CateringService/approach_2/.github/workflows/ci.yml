name: CI Pipeline

on:
  push:
    branches: ['main', 'QA']
  pull_request:
    branches: ['main', 'QA']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Monorepo Typecheck
        run: pnpm run typecheck

      - name: Security Audit
        run: pnpm audit

      - name: Build
        run: pnpm run build

      - name: Run Tests
        run: pnpm run test --workspace-concurrency=1
